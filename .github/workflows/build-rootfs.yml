name: Build & Release Rootfs

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'Target @deepseek-ai/dsh npm version (must be an rc release, e.g. 0.2.1-rc.2). Leave empty to auto-resolve latest RC.'
        required: false
        default: ''
      rootfs_version:
        description: 'Rootfs semantic version (e.g. 1.0.0, 1.0.1). Leave empty to auto-increment from latest GitHub release.'
        required: false
        default: ''
      bridge_version:
        description: 'Bridge plugin version to bundle (e.g. 1.1.0). Leave empty to use the plugin repository latest release.'
        required: false
        default: ''
  schedule:
    # Check for new upstream releases weekly on Mondays
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.version.outputs.dsh_version }}
      rootfs_version: ${{ steps.version.outputs.rootfs_version }}
      bridge_version: ${{ steps.version.outputs.bridge_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute Target Versions
        id: version
        run: |
          USER_DSH="${{ github.event.inputs.dsh_version }}"
          USER_ROOTFS="${{ github.event.inputs.rootfs_version }}"

          if [ -n "$USER_DSH" ]; then
            DSH_VER="$USER_DSH"
          else
            DSH_VER=$(python3 scripts/resolve_version.py npm_dsh)
          fi

          # 校验版本是否符合 RC 版本模式 (-rc.N)
          if ! echo "$DSH_VER" | grep -qE -- '-rc\.[0-9]+$'; then
            echo "Error: DSH version '$DSH_VER' is not an RC version! Only RC builds are permitted."
            exit 1
          fi

          if [ -n "$USER_ROOTFS" ]; then
            ROOTFS_VER="$USER_ROOTFS"
          else
            ROOTFS_VER=$(python3 scripts/resolve_version.py next_rootfs_ver)
          fi

          # The bridge plugin version comes from its own repository's latest
          # release. It is stamped into runtimeVersion as -bridge<version>, which
          # is how the Android client tells an in-place plugin upgrade apart from
          # a mandatory image re-download.
          USER_BRIDGE="${{ github.event.inputs.bridge_version }}"
          if [ -n "$USER_BRIDGE" ]; then
            BRIDGE_VER="$USER_BRIDGE"
          else
            BRIDGE_VER=$(python3 scripts/resolve_version.py bridge)
          fi
          if ! echo "$BRIDGE_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: bridge version '$BRIDGE_VER' is not a plain semver triple."
            exit 1
          fi

          TAG="rootfs-v${ROOTFS_VER}"
          echo "Resolved DSH Version: $DSH_VER"
          echo "Resolved Rootfs Version: $ROOTFS_VER"
          echo "Resolved Bridge Version: $BRIDGE_VER"
          echo "Resolved Release Tag: $TAG"

          # Check if tag already exists on GitHub
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: rootfs-builder" \
            "https://api.github.com/repos/EricFL1998/deepseek-harness-mobile-rootfs/releases/tags/$TAG")
          
          if [ "$HTTP_STATUS" = "200" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Release tag $TAG already exists and triggered by schedule. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "dsh_version=$DSH_VER" >> "$GITHUB_OUTPUT"
            echo "rootfs_version=$ROOTFS_VER" >> "$GITHUB_OUTPUT"
            echo "bridge_version=$BRIDGE_VER" >> "$GITHUB_OUTPUT"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-amd64:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export x86_64 container
        run: |
          DSH_VER="${{ needs.resolve-version.outputs.dsh_version }}"
          docker build \
            --platform linux/amd64 \
            --build-arg DSH_VERSION="${DSH_VER}" \
            --build-arg BRIDGE_VERSION="${{ needs.resolve-version.outputs.bridge_version }}" \
            -t dsh-build:amd64 .
          
          docker create --name c_amd64 dsh-build:amd64
          mkdir -p output
          docker export -o output/rootfs-x86_64.tar c_amd64
          docker rm c_amd64

      - name: Upload amd64 tar
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-tar-amd64
          path: output/rootfs-x86_64.tar
          retention-days: 1

  build-arm64:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export arm64 container
        run: |
          DSH_VER="${{ needs.resolve-version.outputs.dsh_version }}"
          docker build \
            --platform linux/arm64 \
            --build-arg DSH_VERSION="${DSH_VER}" \
            --build-arg BRIDGE_VERSION="${{ needs.resolve-version.outputs.bridge_version }}" \
            -t dsh-build:arm64 .
          
          docker create --name c_arm64 dsh-build:arm64
          mkdir -p output
          docker export -o output/rootfs-arm64.tar c_arm64
          docker rm c_arm64

      - name: Upload arm64 tar
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-tar-arm64
          path: output/rootfs-arm64.tar
          retention-days: 1

  package-and-release:
    needs: [resolve-version, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download amd64 tar
        uses: actions/download-artifact@v4
        with:
          name: rootfs-tar-amd64
          path: tars

      - name: Download arm64 tar
        uses: actions/download-artifact@v4
        with:
          name: rootfs-tar-arm64
          path: tars

      - name: Deterministic package & checksums
        run: |
          python3 scripts/package_rootfs.py \
            "${{ needs.resolve-version.outputs.dsh_version }}" \
            "${{ needs.resolve-version.outputs.rootfs_version }}" \
            "${{ needs.resolve-version.outputs.bridge_version }}" \
            tars/rootfs-x86_64.tar \
            tars/rootfs-arm64.tar \
            dist

      - name: Upload release dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-dist-${{ needs.resolve-version.outputs.release_tag }}
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          name: "Rootfs v${{ needs.resolve-version.outputs.rootfs_version }} (DSH ${{ needs.resolve-version.outputs.dsh_version }}, bridge ${{ needs.resolve-version.outputs.bridge_version }})"
          body: |
            ## Rootfs v${{ needs.resolve-version.outputs.rootfs_version }}

            - **Base OS**: Debian 12 (Bookworm) Slim
            - **Bundled @deepseek-ai/dsh**: `${{ needs.resolve-version.outputs.dsh_version }}`
            - **Bundled dsh-mobile-bridge-plugin**: `${{ needs.resolve-version.outputs.bridge_version }}`
            - **Profile**: `web` pre-installed
            - **Runtime Environment**: Node.js 24, pnpm, Python 3, Git

            `runtimeVersion` is `${{ needs.resolve-version.outputs.rootfs_version }}-dsh${{ needs.resolve-version.outputs.dsh_version }}-bridge${{ needs.resolve-version.outputs.bridge_version }}`.
            A device that only lags on the `bridge` segment can upgrade the plugin in
            place and does **not** need this image.

            ### Assets
            - `rootfs-x86_64.bin` (Android x86_64 emulator)
            - `rootfs-arm64-v8a.bin` (Android arm64-v8a physical device / emulator)
            - `rootfs-manifest.json` (Contract manifest for deepseek-harness-mobile)
          files: |
            dist/rootfs-x86_64.bin
            dist/rootfs-arm64-v8a.bin
            dist/rootfs-manifest.json
          fail_on_unmatched_files: true
