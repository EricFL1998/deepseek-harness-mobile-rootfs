name: Build & Release Rootfs

# The image is rebuilt for exactly three reasons, plus a manual run:
#
#   1. a new @deepseek-ai/dsh release (this workflow resolves the latest RC);
#   2. a new bridge plugin release (the plugin repository dispatches
#      `bridge-release` here after publishing its version-marker tag);
#   3. a change to the image recipe itself (Dockerfile / scripts), because an
#      image-only fix (packaging, native dependencies) has no version triple to
#      move and would otherwise never reach devices.
#
# There is no schedule: rebuilding on a timer would publish identical images and
# advance the rootfs number for no reason. For (1) and (2) the version check
# below is the guard — if neither the DSH engine nor the bundled plugin moved,
# the run resolves and stops. A recipe push (3) always forces a rebuild.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/build-rootfs.yml'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'Target @deepseek-ai/dsh npm version (must be an rc release, e.g. 0.2.1-rc.2). Leave empty to auto-resolve latest RC.'
        required: false
        default: ''
      rootfs_version:
        description: 'Rootfs semantic version (e.g. 1.0.0, 1.0.1). Leave empty to auto-increment from latest GitHub release.'
        required: false
        default: ''
      bridge_version:
        description: 'Bridge plugin version to bundle (e.g. 1.1.0). Leave empty to use the plugin repository latest release.'
        required: false
        default: ''
  # A new bridge plugin release rebuilds the image, so a device that downloads
  # fresh gets the newest plugin already bundled. The plugin repository sends
  # this after publishing its version-marker release.
  repository_dispatch:
    types: [bridge-release]

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.version.outputs.dsh_version }}
      rootfs_version: ${{ steps.version.outputs.rootfs_version }}
      bridge_version: ${{ steps.version.outputs.bridge_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute Target Versions
        id: version
        run: |
          USER_DSH="${{ github.event.inputs.dsh_version }}"
          USER_ROOTFS="${{ github.event.inputs.rootfs_version }}"

          if [ -n "$USER_DSH" ]; then
            DSH_VER="$USER_DSH"
          else
            DSH_VER=$(python3 scripts/resolve_version.py npm_dsh)
          fi

          # 校验版本是否符合 RC 版本模式 (-rc.N)
          if ! echo "$DSH_VER" | grep -qE -- '-rc\.[0-9]+$'; then
            echo "Error: DSH version '$DSH_VER' is not an RC version! Only RC builds are permitted."
            exit 1
          fi

          # The bridge plugin version comes from its own repository's latest
          # release. It is stamped into runtimeVersion as -bridge<version>, which
          # is how the Android client tells an in-place plugin upgrade apart from
          # a mandatory image re-download.
          USER_BRIDGE="${{ github.event.inputs.bridge_version }}"
          if [ -n "$USER_BRIDGE" ]; then
            BRIDGE_VER="$USER_BRIDGE"
          else
            BRIDGE_VER=$(python3 scripts/resolve_version.py bridge)
          fi
          if ! echo "$BRIDGE_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: bridge version '$BRIDGE_VER' is not a plain semver triple."
            exit 1
          fi

          # Build only when the version triple actually moved. The image is
          # rebuilt for exactly three reasons: a new DSH release, a new bridge
          # plugin release, or a change to the image recipe itself. A manual
          # dispatch may still force a rebuild.
          #
          # A recipe push (Dockerfile/scripts) has no version-triple change by
          # definition — the fix is inside the image — so it always forces a
          # rebuild; otherwise an image-only fix could never be published.
          #
          # The comparison reads the newest published image's runtimeVersion,
          # which carries all three segments, so "already current" means the DSH
          # engine and the bundled plugin both match.
          #
          # An unreadable baseline is reported loudly rather than silently
          # treated as "nothing to compare", because that would rebuild on every
          # trigger and defeat the point of the guard.
          LATEST_RUNTIME=$(python3 scripts/latest_runtime_version.py || echo "")
          if [ -z "$LATEST_RUNTIME" ]; then
            echo "::warning::Could not read the newest published runtimeVersion. Building, because an unknown baseline cannot be proven current."
          fi
          CURRENT_TRIPLE="${DSH_VER}|${BRIDGE_VER}"
          LATEST_TRIPLE=""
          if [ -n "$LATEST_RUNTIME" ]; then
            LATEST_TRIPLE=$(python3 scripts/version_triple.py "$LATEST_RUNTIME")
          fi
          echo "Latest published runtimeVersion: ${LATEST_RUNTIME:-<none>}"
          echo "Latest triple: ${LATEST_TRIPLE:-<none>}"
          echo "Wanted triple: $CURRENT_TRIPLE"

          if [ -n "$USER_ROOTFS" ]; then
            # An explicit rootfs version is always honoured.
            ROOTFS_VER="$USER_ROOTFS"
            BUILD=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Image recipe changed: force a rebuild even when the triple matches.
            ROOTFS_VER=$(python3 scripts/resolve_version.py next_rootfs_ver)
            BUILD=true
            echo "Image recipe changed; rebuilding the image as $ROOTFS_VER."
          elif [ -n "$LATEST_TRIPLE" ] && [ "$LATEST_TRIPLE" = "$CURRENT_TRIPLE" ]; then
            ROOTFS_VER=""
            BUILD=false
            echo "dsh and bridge are unchanged since the published $LATEST_RUNTIME; nothing to rebuild."
          else
            ROOTFS_VER=$(python3 scripts/resolve_version.py next_rootfs_ver)
            BUILD=true
          fi

          TAG="rootfs-v${ROOTFS_VER}"
          echo "Resolved DSH Version: $DSH_VER"
          echo "Resolved Bridge Version: $BRIDGE_VER"
          if [ "$BUILD" = "true" ]; then
            echo "Resolved Rootfs Version: $ROOTFS_VER"
            echo "Resolved Release Tag: $TAG"
            echo "dsh_version=$DSH_VER" >> "$GITHUB_OUTPUT"
            echo "rootfs_version=$ROOTFS_VER" >> "$GITHUB_OUTPUT"
            echo "bridge_version=$BRIDGE_VER" >> "$GITHUB_OUTPUT"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-amd64:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export x86_64 container
        run: |
          DSH_VER="${{ needs.resolve-version.outputs.dsh_version }}"
          docker build \
            --platform linux/amd64 \
            --build-arg DSH_VERSION="${DSH_VER}" \
            --build-arg BRIDGE_VERSION="${{ needs.resolve-version.outputs.bridge_version }}" \
            -t dsh-build:amd64 .
          
          docker create --name c_amd64 dsh-build:amd64
          mkdir -p output
          docker export -o output/rootfs-x86_64.tar c_amd64
          docker rm c_amd64

      - name: Upload amd64 tar
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-tar-amd64
          path: output/rootfs-x86_64.tar
          retention-days: 1

  build-arm64:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export arm64 container
        run: |
          DSH_VER="${{ needs.resolve-version.outputs.dsh_version }}"
          docker build \
            --platform linux/arm64 \
            --build-arg DSH_VERSION="${DSH_VER}" \
            --build-arg BRIDGE_VERSION="${{ needs.resolve-version.outputs.bridge_version }}" \
            -t dsh-build:arm64 .
          
          docker create --name c_arm64 dsh-build:arm64
          mkdir -p output
          docker export -o output/rootfs-arm64.tar c_arm64
          docker rm c_arm64

      - name: Upload arm64 tar
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-tar-arm64
          path: output/rootfs-arm64.tar
          retention-days: 1

  package-and-release:
    needs: [resolve-version, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download amd64 tar
        uses: actions/download-artifact@v4
        with:
          name: rootfs-tar-amd64
          path: tars

      - name: Download arm64 tar
        uses: actions/download-artifact@v4
        with:
          name: rootfs-tar-arm64
          path: tars

      - name: Deterministic package & checksums
        run: |
          python3 scripts/package_rootfs.py \
            "${{ needs.resolve-version.outputs.dsh_version }}" \
            "${{ needs.resolve-version.outputs.rootfs_version }}" \
            "${{ needs.resolve-version.outputs.bridge_version }}" \
            tars/rootfs-x86_64.tar \
            tars/rootfs-arm64.tar \
            dist

      - name: Upload release dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-dist-${{ needs.resolve-version.outputs.release_tag }}
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          name: "Rootfs v${{ needs.resolve-version.outputs.rootfs_version }} (DSH ${{ needs.resolve-version.outputs.dsh_version }}, bridge ${{ needs.resolve-version.outputs.bridge_version }})"
          body: |
            ## Rootfs v${{ needs.resolve-version.outputs.rootfs_version }}

            - **Base OS**: Debian 12 (Bookworm) Slim
            - **Bundled @deepseek-ai/dsh**: `${{ needs.resolve-version.outputs.dsh_version }}`
            - **Bundled dsh-mobile-bridge-plugin**: `${{ needs.resolve-version.outputs.bridge_version }}`
            - **Profile**: `web` pre-installed
            - **Runtime Environment**: Node.js 24, pnpm, Python 3, Git

            `runtimeVersion` is `${{ needs.resolve-version.outputs.rootfs_version }}-dsh${{ needs.resolve-version.outputs.dsh_version }}-bridge${{ needs.resolve-version.outputs.bridge_version }}`.
            A device that only lags on the `bridge` segment can upgrade the plugin in
            place and does **not** need this image.

            ### Assets
            - `rootfs-x86_64.bin` (Android x86_64 emulator)
            - `rootfs-arm64-v8a.bin` (Android arm64-v8a physical device / emulator)
            - `rootfs-manifest.json` (Contract manifest for deepseek-harness-mobile)
          files: |
            dist/rootfs-x86_64.bin
            dist/rootfs-arm64-v8a.bin
            dist/rootfs-manifest.json
          fail_on_unmatched_files: true
